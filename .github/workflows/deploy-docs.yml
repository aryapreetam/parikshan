name: Deploy Documentation & Blog

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      include_api:
        description: 'Build API Docs from current branch (main) instead of latest release tag'
        type: boolean
        default: false
      include_demo:
        description: 'Build Wasm Demo from current branch (main) instead of latest release tag'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build & Verify MkDocs Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Build MkDocs Site
        run: mkdocs build --clean

      - name: Bypass Jekyll on GitHub Pages
        run: touch site/.nojekyll

      - name: Set up JDK for Gradle
        if: github.event_name != 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        if: github.event_name != 'pull_request'
        uses: gradle/actions/setup-gradle@v3

      # Build API Docs (From main if flag is set, otherwise from latest release tag)
      - name: Build & Prepare API Docs
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.include_api }}" = "true" ]; then
            echo "==> Building Dokka API Docs from current branch..."
            ./gradlew :parikshan:dokkaGeneratePublicationHtml
          else
            echo "==> Building Dokka API Docs from latest release tag..."
            INITIAL_REF=$(git rev-parse HEAD)
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              echo "Found release tag: $LATEST_TAG"
              git checkout -q "$LATEST_TAG"
            else
              echo "No release tag found, falling back to current branch"
            fi
            ./gradlew :parikshan:dokkaGeneratePublicationHtml
            if [ -n "$LATEST_TAG" ]; then
              git checkout -q "$INITIAL_REF"
            fi
          fi
          mkdir -p site/api
          cp -r parikshan/build/dokka/html/* site/api/

      # Build Wasm Demo (From main if flag is set, otherwise from latest release tag)
      - name: Build & Prepare Wasm Demo
        if: github.event_name != 'pull_request'
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.include_demo }}" = "true" ]; then
            echo "==> Building Wasm Demo from current branch..."
            ./gradlew :samples:multiplatform-showcase:composeApp:wasmJsBrowserDistribution
          else
            echo "==> Building Wasm Demo from latest release tag..."
            INITIAL_REF=$(git rev-parse HEAD)
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ]; then
              echo "Found release tag: $LATEST_TAG"
              git checkout -q "$LATEST_TAG"
            else
              echo "No release tag found, falling back to current branch"
            fi
            ./gradlew :samples:multiplatform-showcase:composeApp:wasmJsBrowserDistribution
            if [ -n "$LATEST_TAG" ]; then
              git checkout -q "$INITIAL_REF"
            fi
          fi
          mkdir -p site/demo
          cp -r samples/multiplatform-showcase/composeApp/build/dist/wasmJs/productionExecutable/* site/demo/

      - name: Upload Pages Artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [ build-and-verify ]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
