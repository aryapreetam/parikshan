name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Weekly full compatibility matrix (Sunday 03:00 UTC)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      target_job:
        description: 'Target CI job(s) to run, comma-separated (e.g. desktop, wasm, windows, android, ios-showcase, all)'
        required: true
        default: 'all'
        type: string
      tier:
        description: 'Matrix tier: fast (CMP 1.12 only) or full (CMP 1.10/1.11/1.12 + all samples)'
        required: false
        default: 'fast'
        type: choice
        options:
          - fast
          - full
      cmp_profile:
        description: 'Override CMP profile for matrix E2E jobs (auto = use tier default)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - '1.10'
          - '1.11'
          - '1.12'
      test_filter:
        description: 'Optional Gradle --tests filter for targeted E2E debugging (e.g. sample.app.FormIntegrationTest)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.target_job || 'auto' }}-${{ inputs.cmp_profile || 'auto' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-template-setup:
    name: Check if template is configured
    runs-on: ubuntu-24.04
    outputs:
      is_configured: ${{ steps.check.outputs.is_configured }}
      target_job: ${{ steps.check-changes.outputs.target_job }}
      tier: ${{ steps.check-changes.outputs.tier }}
      cmp_profile: ${{ steps.check-changes.outputs.cmp_profile }}
      test_filter: ${{ steps.check-changes.outputs.test_filter }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if template has been configured
        id: check
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          echo "GitHub repository name: $REPO_NAME"

          ROOT_PROJECT_NAME=$(grep -oP 'rootProject\.name = "\K[^"]+' settings.gradle.kts || echo "")
          echo "settings.gradle.kts rootProject.name: $ROOT_PROJECT_NAME"

          if [ "$REPO_NAME" = "cmp-lib-template" ] && [ "$ROOT_PROJECT_NAME" = "cmp-lib-template" ]; then
            echo "is_configured=true" >> $GITHUB_OUTPUT
          elif [ "$ROOT_PROJECT_NAME" = "cmp-lib-template" ] && [ "$REPO_NAME" != "cmp-lib-template" ]; then
            echo "is_configured=false" >> $GITHUB_OUTPUT
          else
            echo "is_configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Classify changes and select CI tier
        id: check-changes
        run: |
          set -euo pipefail

          # 1. Explicit manual workflow_dispatch
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target_job=${{ inputs.target_job }}" >> $GITHUB_OUTPUT
            echo "tier=${{ inputs.tier || 'fast' }}" >> $GITHUB_OUTPUT
            echo "cmp_profile=${{ inputs.cmp_profile || 'auto' }}" >> $GITHUB_OUTPUT
            echo "test_filter=${{ inputs.test_filter }}" >> $GITHUB_OUTPUT
            echo "Manual dispatch: target_job=${{ inputs.target_job }}, tier=${{ inputs.tier || 'fast' }}, cmp_profile=${{ inputs.cmp_profile || 'auto' }}, test_filter=${{ inputs.test_filter }}"
            exit 0
          fi

          echo "cmp_profile=auto" >> $GITHUB_OUTPUT
          echo "test_filter=" >> $GITHUB_OUTPUT

          # 2. Scheduled weekly run executes full matrix
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "target_job=all" >> $GITHUB_OUTPUT
            echo "tier=full" >> $GITHUB_OUTPUT
            echo "Scheduled run: full compatibility matrix."
            exit 0
          fi

          # Determine base ref and tier
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            SELECTED_TIER="fast"
          else
            BASE_REF="${{ github.event.before }}"
            if [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ]; then
              BASE_REF="HEAD~1"
            fi
            SELECTED_TIER="full"
          fi

          echo "tier=$SELECTED_TIER" >> $GITHUB_OUTPUT

          CHANGED_FILES=$(git diff --name-only "$BASE_REF"...HEAD 2>/dev/null || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          if [ -z "$CHANGED_FILES" ]; then
            echo "target_job=all" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 3. Docs-only fast path (skip all builds and E2E)
          NON_DOC_FILES=$(echo "$CHANGED_FILES" | grep -v -E '^docs/|^README\.md$|\.md$|^\.github/workflows/deploy-docs\.yml$|^\.github/ISSUE_TEMPLATE/' || true)
          if [ -z "$NON_DOC_FILES" ]; then
            echo "Only documentation/markdown/issue-template files changed. Skipping heavy CI."
            echo "target_job=none" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 4. Version-bump / release-metadata-only fast path
          # Qualifies ONLY if every non-doc file is gradle.properties (libVersion= only)
          # or samples/**/build.gradle.kts (parikshan plugin version line only).
          OTHER_FILES=$(echo "$NON_DOC_FILES" | grep -v -E '^gradle\.properties$|^samples/.+/build\.gradle\.kts$' || true)
          if [ -z "$OTHER_FILES" ]; then
            IS_VERSION_ONLY=true

            if echo "$NON_DOC_FILES" | grep -qx "gradle.properties"; then
              BAD_PROP_DIFF=$(git diff -U0 "$BASE_REF"...HEAD -- gradle.properties | grep -E '^[+-]' | grep -v -E '^(\+\+\+|---) ' | grep -v -E '^[+-]libVersion=[0-9A-Za-z._-]+$' || true)
              if [ -n "$BAD_PROP_DIFF" ]; then
                IS_VERSION_ONLY=false
              fi
            fi

            if [ "$IS_VERSION_ONLY" = "true" ]; then
              while IFS= read -r sample_build; do
                [ -z "$sample_build" ] && continue
                BAD_SAMPLE_DIFF=$(git diff -U0 "$BASE_REF"...HEAD -- "$sample_build" | grep -E '^[+-]' | grep -v -E '^(\+\+\+|---) ' | grep -v -E '^[+-][[:space:]]*id\("io\.github\.aryapreetam\.parikshan"\)[[:space:]]+version[[:space:]]+"[0-9A-Za-z._-]+"[[:space:]]*$' || true)
                if [ -n "$BAD_SAMPLE_DIFF" ]; then
                  IS_VERSION_ONLY=false
                  break
                fi
              done <<< "$(echo "$NON_DOC_FILES" | grep -E '^samples/.+/build\.gradle\.kts$' || true)"
            fi

            if [ "$IS_VERSION_ONLY" = "true" ]; then
              echo "Version-bump / release-metadata-only change detected. Running fast sanity gate (lint + dex-pollution-audit)."
              echo "target_job=lint,dex-pollution-audit" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "Code or workflow changes detected. Running CI (tier=$SELECTED_TIER)."
          echo "target_job=all" >> $GITHUB_OUTPUT

  ci:
    name: CI
    needs: check-template-setup
    if: needs.check-template-setup.outputs.is_configured == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      target_job: ${{ needs.check-template-setup.outputs.target_job }}
      tier: ${{ needs.check-template-setup.outputs.tier }}
      cmp_profile: ${{ needs.check-template-setup.outputs.cmp_profile }}
      test_filter: ${{ needs.check-template-setup.outputs.test_filter }}

  skip-ci:
    name: Template not configured - CI skipped
    needs: check-template-setup
    if: needs.check-template-setup.outputs.is_configured == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Show setup instructions
        run: |
          echo "CI SKIPPED: Template Not Configured"
          echo "Run ./setup-template.sh (Linux/Mac) or setup-template.bat (Windows)."
