site_name: Parikshan
site_url: https://aryapreetam.github.io/parikshan/
repo_url: https://github.com/aryapreetam/parikshan
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - blog:
      archive: false
      categories: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Architecture & Security: reference/architecture.md
  - Features:
      - Capabilities Matrix: features/index.md
      - File Picker Automation: features/file-picker.md
      - Synchronized Execution (--sync): features/synchronized-execution.md
      - Window Layout & Sizing (JVM & Wasm): features/window-layout.md
      - Continuous Watch Mode: features/watch-mode.md
      - Video Recording & Reports: features/test-reports.md
  - User Guides:
      - Compose Multiplatform (KMP):
          - Your First Test: guides/your-first-test.md
          - Testing Forms & Inputs: guides/forms-and-inputs.md
      - Standalone Android: guides/first-test-android.md
  - Configuration & CI:
      - CLI Options: configuration/cli-options.md
      - CI Integration: configuration/ci.md
      - Gradle Plugin Options: advanced/plugins.md
  - Examples: examples.md
  - Blog:
      - blog/index.md
  - Reference:
      - API Overview: reference/api-overview.md
      - API Reference: https://aryapreetam.github.io/parikshan/api/
      - FAQ: getting-started/faq.md
      - Known Limitations: getting-started/known-limitations.md
      - Roadmap: roadmap.md
