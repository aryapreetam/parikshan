name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      run_full_ci:
        description: 'Run full CI matrix before publishing (default: verify this commit already passed CI on main)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  pages: write
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  verify-release-gate:
    name: Verify Commit CI & Release Purity
    runs-on: ubuntu-24.04
    if: ${{ inputs.run_full_ci != true }}
    steps:
      - name: Verify main CI passed on tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REQUIRED_CHECK="CI / CI Success"
          echo "Checking required status check '$REQUIRED_CHECK' on commit $GITHUB_SHA..."
          CONCLUSION=$(gh api -X GET "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
            -f check_name="$REQUIRED_CHECK" \
            -f status="completed" \
            -F per_page=100 \
            --jq '[.check_runs[] | select(.name == "'"$REQUIRED_CHECK"'")] | sort_by(.completed_at) | reverse | .[0].conclusion // ""')
          echo "Check conclusion: '${CONCLUSION}'"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Commit $GITHUB_SHA has not passed '$REQUIRED_CHECK' yet (conclusion='$CONCLUSION'). Wait for main CI to finish or trigger Release manually with run_full_ci=true."
            exit 1
          fi
          echo "✅ Verified '$REQUIRED_CHECK' passed on commit $GITHUB_SHA."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify ABI Compatibility & Release Purity
        run: |
          ./gradlew apiCheck :samples:multiplatform-showcase:androidApp:assembleRelease
          APK_FILE=$(find samples/multiplatform-showcase/androidApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          if $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer dex packages "$APK_FILE" | grep "io.github.aryapreetam.parikshan"; then
            echo "Error: Parikshan classes leaked into production release APK!"
            exit 1
          fi
          echo "✅ ABI check and zero-pollution DEX audit passed."

  ci:
    name: CI
    if: ${{ inputs.run_full_ci == true }}
    uses: ./.github/workflows/ci.yml
    with:
      target_job: 'all'
      tier: 'full'

  publish-library:
    name: Publish Library & Plugin
    runs-on: macos-26
    needs: [ verify-release-gate, ci ]
    if: ${{ always() && !cancelled() && (needs.verify-release-gate.result == 'success' || needs.ci.result == 'success') && needs.verify-release-gate.result != 'failure' && needs.verify-release-gate.result != 'cancelled' && needs.ci.result != 'failure' && needs.ci.result != 'cancelled' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Log Xcode Version
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Restore Kotlin/Native (~/.konan)
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-k2.3.21-${{ hashFiles('gradle/libs.versions.toml', 'settings.gradle.kts') }}
          restore-keys: |
            konan-${{ runner.os }}-${{ runner.arch }}-k2.3.21-
            konan-${{ runner.os }}-${{ runner.arch }}-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Publish to MavenCentral
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
      - name: Publish to Gradle Plugin Portal
        run: ./gradlew :gradle-plugins:publishPlugins --no-configuration-cache
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [ publish-library ]
    if: ${{ always() && !cancelled() && needs.publish-library.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Publish GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $TAG_NAME already exists; skipping."
            exit 0
          fi
          VERSION="${TAG_NAME#v}"
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys
          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          m = re.search(rf"(?m)^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S)
          if m and m.group(1).strip():
              pathlib.Path("release_notes.md").write_text(m.group(1).strip() + "\n", encoding="utf-8")
          PY
          if [ -s release_notes.md ]; then
            gh release create "$TAG_NAME" --title "$TAG_NAME" --latest --notes-file release_notes.md
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --latest --generate-notes
          fi

  build-site:
    name: Build Site (Landing, API, Demo)
    runs-on: ubuntu-24.04
    needs: [ publish-library ]
    if: ${{ always() && !cancelled() && needs.publish-library.result == 'success' }}
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # 1. Build Site Root (MkDocs Material)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material
      - name: Build MkDocs Site
        run: mkdocs build --clean

      # 2. Bypass Jekyll on GitHub Pages
      - name: Add .nojekyll
        run: touch site/.nojekyll

      # 3. Add API Reference (Dokka)
      - name: Generate API Docs
        run: ./gradlew :parikshan:dokkaGeneratePublicationHtml
      - name: Prepare API Docs
        run: |
          mkdir -p site/api
          cp -r parikshan/build/dokka/html/* site/api/

      # 4. Add Demo Site (Wasm)
      - name: Build Wasm Demo
        run: ./gradlew :samples:multiplatform-showcase:composeApp:wasmJsBrowserDistribution
      - name: Prepare Demo Site
        run: |
          mkdir -p site/demo
          cp -r samples/multiplatform-showcase/composeApp/build/dist/wasmJs/productionExecutable/* site/demo/

      # 5. Upload Pages Artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [ build-site ]
    if: ${{ always() && !cancelled() && needs.build-site.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
