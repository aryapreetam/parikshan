#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6G
kotlin.native.jvmArgs=-Xmx6G

#Gradle
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+UseG1GC -Dfile.encoding=UTF-8
