name: Reusable CI (lint, build+tests, e2e)

on:
  workflow_call:
    inputs:
      target_job:
        description: 'Target CI job to run'
        required: false
        type: string
        default: 'all'

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  lint:
    name: Lint and code style
    if: "inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'lint')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Check code style (lint)
        run: ./gradlew lintRelease
      - name: Check ABI Compatibility
        run: ./gradlew apiCheck

  unit-tests:
    name: Unit Tests (${{ matrix.target }})
    needs: [ lint ]
    if: "inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'unit-tests')"
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: jvm
            os: ubuntu-latest
          - target: ios
            os: macos-latest
          - target: wasm
            os: ubuntu-latest
          - target: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run unit tests
        shell: bash
        run: |
          set -e
          case "${{ matrix.target }}" in
            jvm)
              ./gradlew :gradle-plugins:test :parikshan-server:test :parikshan-core:jvmTest :parikshan-client:jvmTest :samples:multiplatform-showcase:composeApp:jvmTest :parikshan-core:koverHtmlReport :parikshan-core:koverXmlReport
              ;;
            ios)
              ./gradlew :parikshan-core:iosSimulatorArm64Test :parikshan-client:iosSimulatorArm64Test :samples:multiplatform-showcase:composeApp:iosSimulatorArm64Test
              ;;
            wasm)
              ./gradlew :parikshan-core:wasmJsBrowserTest :parikshan-client:wasmJsBrowserTest :samples:multiplatform-showcase:composeApp:wasmJsBrowserTest
              ;;
            android)
              ./gradlew :parikshan-client:testAndroid :samples:multiplatform-showcase:androidApp:testDebugUnitTest
              ;;
          esac
      - name: Verify Library Publication (Dry-Run)
        if: matrix.target == 'ios'
        run: ./gradlew publishToMavenLocal --no-configuration-cache
      - name: Upload Kover Coverage Artifacts
        if: matrix.target == 'jvm'
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-kover-coverage-reports
          path: parikshan-core/build/reports/kover/
          if-no-files-found: ignore

  e2e-android:
    name: E2E Android (CMP ${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    if: "!failure() && !cancelled() && (inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'android'))"
    strategy:
      fail-fast: false
      matrix:
        profile: ['1.10', '1.11', '1.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Parikshan Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :samples:multiplatform-showcase:composeApp:e2eAndroidTest -PcmpProfile=${{ matrix.profile }} -Dparikshan.video.enabled=true --no-configuration-cache --tests="sample.app.AccessibilityIntegrationTest.testSubtextMatching"
      - name: Upload Android Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-android-videos-${{ matrix.profile }}
          path: samples/multiplatform-showcase/composeApp/build/parikshan/videos/android/
          if-no-files-found: ignore

  e2e-desktop:
    name: E2E Desktop (CMP ${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    if: "!failure() && !cancelled() && (inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'desktop'))"
    strategy:
      fail-fast: false
      matrix:
        profile: ['1.10', '1.11', '1.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Parikshan Desktop E2E tests
        uses: aryapreetam/parikshan-desktop-action@v1
        with:
          command: './gradlew :samples:multiplatform-showcase:composeApp:e2eJvmTest -PcmpProfile=${{ matrix.profile }} -Dparikshan.video.enabled=true --no-configuration-cache'
      - name: Upload Desktop Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-desktop-videos-${{ matrix.profile }}
          path: samples/multiplatform-showcase/composeApp/build/parikshan/videos/desktop/
          if-no-files-found: ignore

  e2e-wasm:
    name: E2E Wasm (CMP ${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    if: "!failure() && !cancelled() && (inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'wasm'))"
    strategy:
      fail-fast: false
      matrix:
        profile: ['1.10', '1.11', '1.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Parikshan Wasm E2E tests
        uses: aryapreetam/parikshan-wasm-action@v1
        with:
          command: './gradlew :samples:multiplatform-showcase:composeApp:e2eWasmTest -PcmpProfile=${{ matrix.profile }} -Dparikshan.video.enabled=true --no-configuration-cache'
      - name: Upload Wasm Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-wasm-videos-${{ matrix.profile }}
          path: samples/multiplatform-showcase/composeApp/build/parikshan/videos/wasm/
          if-no-files-found: ignore

  e2e-windows:
    name: E2E Windows (JVM + Wasm, CMP 1.10)
    runs-on: windows-latest
    needs: [ unit-tests ]
    if: "!failure() && !cancelled() && (inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'windows'))"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Windows E2E tests (JVM + Wasm)
        shell: bash
        run: |
          ./gradlew :samples:multiplatform-showcase:composeApp:e2eTest --targets=jvm,wasm -PcmpProfile=1.10 --no-configuration-cache
      - name: Upload Windows E2E Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-windows-e2e-reports
          path: |
            samples/multiplatform-showcase/composeApp/build/parikshan/logs/
            samples/multiplatform-showcase/composeApp/build/reports/tests/
          if-no-files-found: ignore

  e2e-sync:
    name: E2E Sync (JVM + Wasm)
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    if: "!failure() && !cancelled() && (inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'sync'))"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Setup Desktop E2E Environment
        uses: aryapreetam/parikshan-desktop-action@v1
        with:
          command: 'echo "Desktop environment setup complete."'
      - name: Setup WASM E2E Environment
        uses: aryapreetam/parikshan-wasm-action@v1
        with:
          command: 'echo "WASM environment setup complete."'
      - name: Run Parikshan Synchronized E2E tests
        run: |
          xvfb-run ./gradlew :samples:multiplatform-showcase:composeApp:e2eTest --targets=jvm,wasm --tests="sample.app.FormIntegrationTest.testSliderDrag" --sync --window-size=360x720 --layout=side-by-side --no-configuration-cache

  e2e-watch-script:
    name: E2E Watch Verification Script
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    if: "!failure() && !cancelled() && (inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'watch-script'))"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Setup Desktop E2E Environment
        uses: aryapreetam/parikshan-desktop-action@v1
        with:
          command: 'echo "Desktop setup complete."'
      - name: Setup WASM E2E Environment
        uses: aryapreetam/parikshan-wasm-action@v1
        with:
          command: 'echo "WASM setup complete."'
      - name: Pre-warm Watch Dependencies
        run: |
          ./gradlew :samples:multiplatform-showcase:composeApp:packageUberJarForCurrentOS \
                    :samples:multiplatform-showcase:composeApp:wasmJsBrowserDevelopmentWebpack \
                    :samples:multiplatform-showcase:composeApp:installPlaywrightBrowsers
      - name: Run Watch Mode Verification Script
        run: |
          xvfb-run ./scripts/verify-watch-mode.sh
      - name: Upload Watch Script Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-watch-script-logs
          path: build/parikshan/logs/
          if-no-files-found: ignore

  e2e-ios-showcase:
    name: E2E iOS Showcase (CMP ${{ matrix.profile }})
    runs-on: macos-latest
    needs: [ unit-tests ]
    if: "!failure() && !cancelled() && (inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'ios-showcase'))"
    strategy:
      fail-fast: false
      matrix:
        profile: ['1.10', '1.11', '1.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: List Available Simulators
        run: |
          xcrun simctl list devices available
      - name: Pre-compile Kotlin Native Framework
        run: |
          ./gradlew :samples:multiplatform-showcase:composeApp:linkDebugFrameworkIosSimulatorArm64 -PcmpProfile=${{ matrix.profile }} -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Pparikshan.e2e.active=true
      - name: Run Showcase iOS E2E tests
        run: |
          TEST_FILTER=""
          if [ "${{ matrix.profile }}" = "1.10" ]; then
            TEST_FILTER='--tests="sample.app.AccessibilityIntegrationTest.testSubtextMatching"'
          fi
          ./gradlew :samples:multiplatform-showcase:composeApp:e2eIosTest \
            -PcmpProfile=${{ matrix.profile }} \
            -Dparikshan.video.enabled=true \
            --no-configuration-cache \
            $TEST_FILTER \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" \
            -Dparikshan.xcodebuild.timeout=1800
      - name: Upload iOS E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-ios-showcase-results-${{ matrix.profile }}
          path: |
            samples/multiplatform-showcase/composeApp/build/parikshan/
            samples/multiplatform-showcase/composeApp/build/reports/
          if-no-files-found: ignore

  e2e-ios-cmp-latest:
    name: E2E iOS cmp-latest
    runs-on: macos-latest
    needs: [ unit-tests ]
    if: "!failure() && !cancelled() && (inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'ios-cmp-latest'))"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: List Available Simulators
        run: |
          xcrun simctl list devices available
      - name: Pre-compile Kotlin Native Framework
        working-directory: samples/cmp-latest
        run: |
          ./gradlew :app:shared:linkDebugFrameworkIosSimulatorArm64 -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Pparikshan.e2e.active=true
      - name: Run cmp-latest iOS E2E tests
        working-directory: samples/cmp-latest
        run: |
          ./gradlew :app:shared:e2eIosTest -Dparikshan.video.enabled=true --no-configuration-cache --tests="org.example.project.StorefrontFlowTest" -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Dparikshan.xcodebuild.timeout=1800
      - name: Upload iOS E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-ios-cmp-latest-results
          path: |
            samples/cmp-latest/app/shared/build/parikshan/
            samples/cmp-latest/app/shared/build/reports/
            if-no-files-found: ignore

  e2e-ios-issue-playground:
    name: E2E iOS issue-playground
    runs-on: macos-latest
    needs: [ unit-tests ]
    if: "!failure() && !cancelled() && (inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'ios-issue-playground'))"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: List Available Simulators
        run: |
          xcrun simctl list devices available
      - name: Pre-compile Kotlin Native Framework
        working-directory: samples/issue-playground
        run: |
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Pparikshan.e2e.active=true
      - name: Run issue-playground iOS E2E tests
        working-directory: samples/issue-playground
        run: |
          ./gradlew :shared:e2eIosTest -Dparikshan.video.enabled=true --no-configuration-cache -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Dparikshan.xcodebuild.timeout=1800
      - name: Upload iOS E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-ios-issue-playground-results
          path: |
            samples/issue-playground/shared/build/parikshan/
            samples/issue-playground/shared/build/reports/
            if-no-files-found: ignore

  e2e-ios-composables:
    name: E2E iOS composables-sample
    runs-on: macos-latest
    needs: [ unit-tests ]
    if: "!failure() && !cancelled() && (inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'ios-composables'))"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml', '**/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: List Available Simulators
        run: |
          xcrun simctl list devices available
      - name: Pre-compile Kotlin Native Framework
        working-directory: samples/composables-sample
        run: |
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Pparikshan.e2e.active=true
      - name: Run composables-sample iOS E2E tests
        working-directory: samples/composables-sample
        run: |
          ./gradlew :shared:e2eIosTest -Dparikshan.video.enabled=true --no-configuration-cache --tests="com.example.app.SampleE2ETest" -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC" -Dparikshan.xcodebuild.timeout=1800
      - name: Upload iOS E2E Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-ios-composables-results
          path: |
            samples/composables-sample/shared/build/parikshan/
            samples/composables-sample/shared/build/reports/
            if-no-files-found: ignore

  dex-pollution-audit:
    name: DEX Footprint Audit
    runs-on: ubuntu-latest
    needs: [ lint ]
    if: "!failure() && !cancelled() && (inputs.target_job == 'all' || inputs.target_job == '' || contains(inputs.target_job, 'dex-pollution-audit'))"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Release APK
        run: ./gradlew :samples:multiplatform-showcase:androidApp:assembleRelease
      - name: Audit Release APK DEX for Parikshan leaks
        run: |
          APK_FILE=$(find samples/multiplatform-showcase/androidApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found release APK: $APK_FILE"
          
          # Execute apkanalyzer to check for io.github.aryapreetam.parikshan package
          if $ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer dex packages "$APK_FILE" | grep "io.github.aryapreetam.parikshan"; then
            echo "Error: Parikshan classes leaked into production release APK!"
            exit 1
          else
            echo "Success: Zero-pollution audit passed. No Parikshan classes found in release APK."
          fi

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - unit-tests
      - e2e-android
      - e2e-desktop
      - e2e-wasm
      - e2e-windows
      - e2e-ios-showcase
      - e2e-ios-cmp-latest
      - e2e-ios-issue-playground
      - e2e-ios-composables
      - dex-pollution-audit
      - e2e-watch-script
      - e2e-sync
    steps:
      - name: Verify all required jobs passed
        run: |
          needs_json='${{ toJson(needs) }}'
          echo "Job statuses: $needs_json"
          if echo "$needs_json" | grep -q '"result": "failure"\|"result": "cancelled"'; then
            echo "❌ One or more required CI jobs failed or were cancelled!"
            exit 1
          fi
          echo "✅ All required CI jobs completed successfully!"
