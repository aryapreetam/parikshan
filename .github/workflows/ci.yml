name: Reusable CI (lint, build+tests, e2e)

on:
  workflow_call:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  lint:
    name: Lint and code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Check code style (lint)
        run: ./gradlew lintRelease
      - name: Check ABI Compatibility
        run: ./gradlew apiCheck

  unit-tests:
    name: Unit Tests (${{ matrix.target }})
    needs: [ lint ]
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: jvm
            os: ubuntu-latest
          - target: ios
            os: macos-latest
          - target: wasm
            os: ubuntu-latest
          - target: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-${{ runner.os }}-
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run unit tests
        shell: bash
        run: |
          set -e
          case "${{ matrix.target }}" in
            jvm)
              ./gradlew :parikshan-server:test :parikshan-core:jvmTest :parikshan-client:jvmTest :samples:multiplatform-showcase:composeApp:jvmTest
              ;;
            ios)
              ./gradlew :parikshan-core:iosSimulatorArm64Test :parikshan-client:iosSimulatorArm64Test :samples:multiplatform-showcase:composeApp:iosSimulatorArm64Test
              ;;
            wasm)
              ./gradlew :parikshan-core:wasmJsBrowserTest :parikshan-client:wasmJsBrowserTest :samples:multiplatform-showcase:composeApp:wasmJsBrowserTest
              ;;
            android)
              ./gradlew :parikshan-client:testAndroid :samples:multiplatform-showcase:androidApp:testDebugUnitTest
              ;;
          esac

  e2e-android:
    name: E2E Android (emulator)
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Parikshan Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :samples:multiplatform-showcase:composeApp:e2eAndroidTest -Dparikshan.video.enabled=true --no-configuration-cache --tests="sample.app.SubtextScenarios.testSubtextMatching"
      - name: Upload Android Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-android-videos
          path: samples/multiplatform-showcase/composeApp/build/parikshan/videos/android/
          if-no-files-found: ignore

  e2e-desktop:
    name: E2E Desktop
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Parikshan Desktop E2E tests
        uses: aryapreetam/parikshan-desktop-action@v1
        with:
          command: './gradlew :samples:multiplatform-showcase:composeApp:e2eDesktopTest -Dparikshan.video.enabled=true --no-configuration-cache --tests="sample.app.SubtextScenarios.testSubtextMatching"'
      - name: Upload Desktop Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-desktop-videos
          path: samples/multiplatform-showcase/composeApp/build/parikshan/videos/desktop/
          if-no-files-found: ignore

  e2e-wasm:
    name: E2E Wasm
    runs-on: ubuntu-latest
    needs: [ unit-tests ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Parikshan Wasm E2E tests
        uses: aryapreetam/parikshan-wasm-action@v1
        with:
          command: './gradlew :samples:multiplatform-showcase:composeApp:e2eWasmTest -Dparikshan.video.enabled=true --no-configuration-cache --tests="sample.app.SubtextScenarios.testSubtextMatching"'
      - name: Upload Wasm Videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parikshan-wasm-videos
          path: samples/multiplatform-showcase/composeApp/build/parikshan/videos/wasm/
          if-no-files-found: ignore

